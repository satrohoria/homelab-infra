---
- name: Configurar Docker no Homelab
  hosts: homelab
  become: true

  tasks:
    - name: Garantir pacotes necessários para Docker
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - gnupg
        state: present
        update_cache: true

    - name: Garantir diretório de keyrings
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    - name: Verificar se Docker está instalado
      ansible.builtin.command:
        cmd: docker --version
      register: docker_version
      changed_when: false
      failed_when: false

    - name: Mostrar versão atual do Docker
      ansible.builtin.debug:
        var: docker_version.stdout

    - name: Garantir serviço Docker habilitado e iniciado
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true

    - name: Garantir usuário no grupo docker
      ansible.builtin.user:
        name: "{{ homelab_user }}"
        groups: docker
        append: true
