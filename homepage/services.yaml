- Monitoramento:
    - Beszel:
        icon: beszel
        href: https://beszel.home
        description: Monitoramento do servidor
        server: local
        container: beszel

    - Dozzle:
        icon: dozzle
        href: https://logs.home
        description: Logs dos containers
        server: local
