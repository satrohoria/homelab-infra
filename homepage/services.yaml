    - Scrutiny:
        icon: scrutiny
        href: https://scrutiny.home
        description: Saúde do SSD
        server: local
        container: scrutiny

    - Speedtest Tracker:
        icon: speedtest-tracker
        href: https://speedtest.home
        description: Speedtest pelo Dell (100 Mbps)
        server: local
        container: speedtest-tracker

    - Speedtest Desktop:
        icon: mdi-speedometer
        href: https://speedpc.home
        description: Internet via Desktop Gigabit

        widget:
          type: customapi
          url: https://speedpc.home/speedtest-latest.json
          refreshInterval: 60000

          mappings:
            - field: DownloadMbps
              label: Download
              format: float
              suffix: " Mbps"

            - field: UploadMbps
              label: Upload
              format: float
              suffix: " Mbps"

            - field: PingMs
              label: Ping
              format: float
              suffix: " ms"

            - field: PacketLoss
              label: Perda
              format: float
              suffix: " %"


