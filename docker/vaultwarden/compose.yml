services:
  vaultwarden:
    image: vaultwarden/server:latest
    container_name: vaultwarden
    environment:
      DOMAIN: "https://vault.home"
      SIGNUPS_ALLOWED: "false"
      WEBSOCKET_ENABLED: "true"
      TZ: "America/Sao_Paulo"
    volumes:
      - ./data:/data
    networks:
      - caddy-net
    restart: unless-stopped

networks:
  caddy-net:
    external: true
